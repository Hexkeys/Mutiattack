<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mutiattack — Multiplayer 2D Shooter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#080b14;color:#fff}body{display:flex;flex-direction:column}.top{height:46px;display:flex;align-items:center;padding:6px 10px;background:#111827;z-index:2}.top h1{font-size:17px;margin:0}.topmeta{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px}.load{opacity:.7}.top input,.top #join{display:none}input,button,select{border:0;border-radius:8px;padding:9px 11px;background:#1f2937;color:#fff}button{background:#2563eb;font-weight:700}.wrap{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;background:#0d1420;touch-action:none}#arena{position:absolute;inset:0}.perf{position:absolute;left:12px;top:46px;z-index:2;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.45);font-size:11px;color:#cbd5e1;pointer-events:none}.perf b{color:#fff}.hud{position:absolute;left:12px;top:12px;z-index:2;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.45);font-size:13px}.announcements{position:absolute;left:50%;top:54px;transform:translateX(-50%);z-index:4;width:min(420px,calc(100vw - 24px));display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}.announcement{padding:7px 12px;border-radius:999px;background:rgba(15,23,42,.86);border:1px solid rgba(255,255,255,.12);box-shadow:0 6px 22px rgba(0,0,0,.28);font-size:13px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;animation:announceIn .18s ease-out}.announcement.power{border-color:rgba(192,132,252,.55);color:#e9d5ff}.announcement.death{border-color:rgba(248,113,113,.55);color:#fecaca}.announcement.join,.announcement.respawn{border-color:rgba(96,165,250,.45);color:#dbeafe}.announcement.leave{border-color:rgba(148,163,184,.45);color:#cbd5e1}@keyframes announceIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}.kit{padding:6px 8px;font-si </style></head><body>
<div class="top"><h1>Mutiattack</h1><div class="topmeta"><span id="load" class="load">Connecting…</span><span id="build">Kit: Striker • Gun: Pistol</span></div></div>
<div class="wrap"><div id="arena"><canvas id="game"></canvas></div><div class="hud" id="hud">Gun: Pistol</div><div class="perf" id="perf">FPS: <b>--</b> • Ping: <b>--</b></div><div class="streakhud" id="streakhud"></div><div class="powerhud" id="powerhud">PHASE POWER: 10.0s</div><div class="announcements" id="announcements"></div><button class="exit" id="exit">EXIT</button><div class="hint">Left: move • Right: aim & shoot</div><div id="leftStick"><div class="knob"></div></div><div id="rightStick"><div class="knob"></div></div>
<div id="lobby"><div class="card"><h2>MUTIATTACK</h2><p>Choose your weapon and jump in.</p><input id="lobbyName" placeholder="Your name" value="Player"><input id="lobbyRoom" placeholder="Room code" value="lobby"><select id="lobbyKit"><option value="striker">Striker — balanced</option><option value="tank">Tank — more HP</option><option value="scout">Scout — faster</option><option value="juggernaut">Juggernaut — huge HP</option><option value="assassin">Assassin — very fast</option><option value="ranger">Ranger — damage</option></select><select id="lobbyGun"><option value="pistol">Pistol — balanced</option><option value="smg">SMG — fast fire</option><option value="shotgun">Shotgun — spread</option><option value="rifle">Rifle — heavy hit</option></select><button class="play" id="play">PLAY</button></div></div></div>
<script src="/socket.io/socket.io.js" onerror="document.querySelector('#load').textContent='Socket unavailable'"></script><script>
let socket=null;
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d",{alpha:false,desynchronized:true}),loadEl=document.querySelector("#load"),buildEl=document.querySelector("#build"),left=document.querySelector("#leftStick"),right=document.querySelector("#rightStick"),lobby=document.querySelector("#lobby"),hud=document.querySelector("#hud"),powerhud=document.querySelector("#powerhud"),perf=document.querySelector("#perf"),wrap=document.querySelector(".wrap"),exitBtn=document.querySelector("#exit"),announcements=document.querySelector("#announcements"),streakhud=document.querySelector("#streakhud");
let fpsFrames=0,fpsLast=performance.now(),displayFps=0,ping=0;
let game={players:[],bullets:[],obstacles:[],powerups:[],world:{w:2400,h:1400}},meId=null,lastShot=0,keys=new Set(),moveStick={x:0,y:0},aimStick={x:0,y:0},mouseAim={x:0,y:0},mouseDown=false,renderPlayers=new Map(),camera={x:1200,y:700},dpr=1,viewW=innerWidth,viewH=wrap.clientHeight,lastFrame=performance.now(),localPos=null,correction={x:0,y:0},inputState={x:0,y:0,angle:0},selectedGun="pistol",selectedKit="striker",arrowAngle=0,aimTargetId=null;
function resize(){viewW=innerWidth;viewH=wrap.clientHeight;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(1,Math.floor(viewW*dpr));canvas.height=Math.max(1,Math.floor(viewH*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function setConnectionState(text){loadEl.textContent=text}
function initSocket(){
 if(!window.io){setConnectionState("Socket client missing");return null}
 const s=window.io(window.location.origin,{path:"/socket.io",timeout:5000,reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:500,reconnectionDelayMax:1500,transports:["websocket","polling"]});
 s.on("connect",()=>{setConnectionState("Connected");measurePing()});
 s.on("connect_error",()=>setConnectionState("Connection error • retrying…"));
 s.io.on("reconnect_attempt",()=>setConnectionState("Reconnecting…"));
 s.on("disconnect",()=>setConnectionState("Reconnecting…"));
 setTimeout(()=>{if(!s.connected)setConnectionState("Server unavailable • retrying…")},7000);
 return s
}
socket=initSocket();
function measurePing(){if(!socket.connected)return;const t=performance.now();socket.emit("pingCheck",()=>{ping=Math.round(performance.now()-t)});setTimeout(measurePing,2000)}
socket.on("announcement",a=>{const el=document.createElement("div");el.className="announcement "+(a.type||"info");el.textContent=a.text;announcements.appendChild(el);while(announcements.children.length>5)announcements.firstElementChild.remove();setTimeout(()=>{el.style.opacity="0";el.style.transform="translateY(-5px)";el.style.transition="opacity .3s,transform .3s";setTimeout(()=>el.remove(),320)},4200)});
socket.on("joined",d=>{meId=d.id;selectedGun=d.gun||"pistol";selectedKit=d.kit||"striker";loadEl.textContent="Connected";aimTargetId=null;localPos={x:d.x,y:d.y};camera.x=d.x;camera.y=d.y;updateHeader();});
socket.on("state",s=>{game=s;const seen=new Set();for(const p of s.players){seen.add(p.id);if(p.id===meId){if(!localPos)localPos={x:p.x,y:p.y};correction.x+=p.x-localPos.x;correction.y+=p.y-localPos.y}const old=renderPlayers.get(p.id)||{rx:p.x,ry:p.y};renderPlayers.set(p.id,{...p,rx:old.rx,ry:old.ry,tx:p.x,ty:p.y})}for(const[id]of renderPlayers)if(!seen.has(id)&&id!==meId){renderPlayers.delete(id);if(aimTargetId===id)aimTargetId=null}});
function updateHeader(){const p=renderPlayers.get(meId);const kit=p?.kit||document.querySelector("#lobbyKit").value||"striker",gun=p?.gun||document.querySelector("#lobbyGun").value||"pistol";buildEl.textContent="Kit: "+kit[0].toUpperCase()+kit.slice(1)+" • Gun: "+gun.toUpperCase()}
function join(){if(!socket||!socket.connected){setConnectionState("Not connected yet");return}const name=document.querySelector("#lobbyName").value||"Player",room=document.querySelector("#lobbyRoom").value||"lobby",gun=document.querySelector("#lobbyGun").value,kit=document.querySelector("#lobbyKit").value;selectedGun=gun;selectedKit=kit;socket.emit("joinRoom",{roomId:room,name,gun,kit});lobby.style.display="none";updateHeader()}
document.querySelector("#play").onclick=join;
exitBtn.onclick=()=>{socket.disconnect();renderPlayers.clear();game.players=[];meId=null;localPos=null;correction={x:0,y:0};aimTargetId=null;lobby.style.display="flex";loadEl.textContent="Reconnecting…";setTimeout(()=>{if(socket&&!socket.connected)socket.connect()},50)};
addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," ","enter"].includes(k))e.preventDefault();keys.add(k)});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
addEventListener("blur",()=>{keys.clear();moveStick={x:0,y:0};aimStick={x:0,y:0};mouseDown=false});
canvas.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const rect=canvas.getBoundingClientRect();mouseAim={x:e.clientX-rect.left,y:e.clientY-rect.top};if(localPos){const worldX=mouseAim.x-viewW/2+camera.x,worldY=mouseAim.y-viewH/2+camera.y;inputState.angle=getAimAngle(Math.atan2(worldY-localPos.y,worldX-localPos.x))}});
canvas.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"){mouseDown=true;canvas.setPointerCapture(e.pointerId);e.preventDefault()}});
canvas.addEventListener("pointerup",e=>{if(e.pointerType==="mouse"){mouseDown=false;try{canvas.releasePointerCapture(e.pointerId)}catch{}}});
function stick(el,type){let activeId=null;function setPoint(p){const r=el.getBoundingClientRect();let x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2),d=Math.hypot(x,y);if(d>55){x=x/d*55;y=y/d*55}el.querySelector(".knob").style.transform=`translate(${x}px,${y}px)`;if(type==="move")moveStick={x:x/55,y:y/55};else aimStick={x:x/55,y:y/55}}el.addEventListener("pointerdown",e=>{if(activeId!==null)return;activeId=e.pointerId;el.setPointerCapture(e.pointerId);setPoint(e);e.preventDefault()},{passive:false});el.addEventListener("pointermove",e=>{if(e.pointerId===activeId){setPoint(e);e.preventDefault()}},{passive:false});function end(e){if(e.pointerId!==activeId)return;activeId=null;el.querySelector(".knob").style.transform="";if(type==="move")moveStick={x:0,y:0};else aimStick={x:0,y:0}}el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end)}
stick(left,"move");stick(right,"aim");

function getAimAngle(baseAngle){
 const me=renderPlayers.get(meId);
 if(!me||!localPos)return baseAngle;
 const maxDistance=720,maxAssistAngle=.48;
 let target=null,bestScore=Infinity;
 for(const q of renderPlayers.values()){
  if(q.id===meId||q.hp<=0||q.invisible)continue;
  const dx=q.rx-localPos.x,dy=q.ry-localPos.y,d=Math.hypot(dx,dy);
  if(d>maxDistance||d<1)continue;
  const targetAngle=Math.atan2(dy,dx);
  let delta=targetAngle-baseAngle;
  while(delta>Math.PI)delta-=Math.PI*2;
  while(delta<-Math.PI)delta+=Math.PI*2;
  const abs=Math.abs(delta);
  if(abs>maxAssistAngle)continue;
  const score=abs+(d/maxDistance)*.10;
  if(score<bestScore){bestScore=score;target=q}
 }
 if(!target)return baseAngle;
 if(aimTargetId!==target.id){
  aimTargetId=target.id;
 }
 const targetAngle=Math.atan2(target.ry-localPos.y,target.rx-localPos.x);
 let delta=targetAngle-baseAngle;
 while(delta>Math.PI)delta-=Math.PI*2;
 while(delta<-Math.PI)delta+=Math.PI*2;
 const strength=Math.max(0,.24*(1-Math.abs(delta)/maxAssistAngle));
 return baseAngle+delta*strength;
}

setInterval(()=>{if(!meId||!socket?.connected)return;let dx=moveStick.x,dy=moveStick.y;if(keys.has("a")||keys.has("arrowleft"))dx-=1;if(keys.has("d")||keys.has("arrowright"))dx+=1;if(keys.has("w")||keys.has("arrowup"))dy-=1;if(keys.has("s")||keys.has("arrowdown"))dy+=1;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}const p=game.players.find(p=>p.id===meId),angleBase=p?.angle||inputState.angle||0;let angle=angleBase;if(Math.hypot(aimStick.x,aimStick.y)>.15)angle=Math.atan2(aimStick.y,aimStick.x);else if(keys.has(" ")||keys.has("enter"))angle=angleBase;const assistedAngle=getAimAngle(angle);inputState={x:dx,y:dy,angle:assistedAngle};socket.volatile.emit("playerInput",inputState);const now=performance.now(),gun=p?.gun||selectedGun||"pistol",rate=gun==="smg"?75:gun==="shotgun"?520:gun==="rifle"?360:220;if((Math.hypot(aimStick.x,aimStick.y)>.15||mouseDown||keys.has(" ")||keys.has("enter"))&&now-lastShot>rate){socket.emit("shoot",{angle:assistedAngle});lastShot=now}},33);

function frame(now){
 fpsFrames++;
 if(now-fpsLast>=500){displayFps=Math.round(fpsFrames*1000/(now-fpsLast));fpsFrames=0;fpsLast=now;perf.innerHTML='FPS: <b>'+displayFps+'</b> • Ping: <b>'+ping+'ms</b>'}
 const dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;
 const p=renderPlayers.get(meId),speed=(p?.kit==="scout"?350:p?.kit==="tank"?270:p?.kit==="juggernaut"?250:p?.kit==="assassin"?380:p?.kit==="striker"?320:300),powerLeft=p&&p.powerMs?Math.max(0,p.powerMs/1000):0;
 if(localPos){localPos.x+=inputState.x*speed*dt;localPos.y+=inputState.y*speed*dt;localPos.x=Math.max(18,Math.min(game.world.w-18,localPos.x));localPos.y=Math.max(18,Math.min(game.world.h-18,localPos.y));const correctionBlend=1-Math.exp(-16*dt);localPos.x+=correction.x*correctionBlend;localPos.y+=correction.y*correctionBlend;correction.x*=1-correctionBlend;correction.y*=1-correctionBlend}
 const follow=1-Math.exp(-18*dt),w=viewW,h=viewH;if(localPos){camera.x+=(localPos.x-camera.x)*follow;camera.y+=(localPos.y-camera.y)*follow}
 updateHeader();
 const streak=p?.streak||0;
 if(streak>=3){streakhud.style.display="block";streakhud.textContent=streak+" KILL STREAK";}else{streakhud.style.display="none";}powerhud.style.display=powerLeft?"block":"none";if(powerLeft)powerhud.textContent="PHASE POWER: "+powerLeft.toFixed(1)+"s";
 ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2-camera.x,h/2-camera.y);
 const world=game.world||{w:2400,h:1400},leftX=camera.x-w/2-60,rightX=camera.x+w/2+60,topY=camera.y-h/2-60,bottomY=camera.y+h/2+60;
 ctx.fillStyle="#0a101b";ctx.fillRect(0,0,world.w,world.h);
 ctx.save();ctx.globalAlpha=.32;ctx.strokeStyle="#334155";ctx.lineWidth=2;for(let y=Math.floor(topY/96)*96;y<=bottomY;y+=96){ctx.beginPath();ctx.moveTo(leftX,y);ctx.lineTo(rightX,y);ctx.stroke()}ctx.globalAlpha=1;ctx.restore();
 ctx.strokeStyle="#64748b";ctx.lineWidth=10;ctx.strokeRect(0,0,world.w,world.h);ctx.strokeStyle="rgba(96,165,250,.35)";ctx.lineWidth=3;ctx.strokeRect(5,5,world.w-10,world.h-10);ctx.strokeStyle="rgba(255,255,255,.06)";ctx.beginPath();for(let x=Math.floor(leftX/48)*48;x<=rightX;x+=48){ctx.moveTo(x,topY);ctx.lineTo(x,bottomY)}for(let y=Math.floor(topY/48)*48;y<=bottomY;y+=48){ctx.moveTo(leftX,y);ctx.lineTo(rightX,y)}ctx.stroke();
 for(const o of game.obstacles){if(o.x+o.w<leftX||o.x>rightX||o.y+o.h<topY||o.y>bottomY)continue;ctx.fillStyle="rgba(0,0,0,.28)";ctx.fillRect(o.x+8,o.y+10,o.w,o.h);ctx.fillStyle="#475569";ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle="#64748b";ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y);ctx.lineTo(o.x+o.w,o.y-9);ctx.lineTo(o.x,o.y-9);ctx.closePath();ctx.fill();ctx.fillStyle="#1e293b";ctx.beginPath();ctx.moveTo(o.x+o.w,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.lineTo(o.x+o.w+8,o.y+o.h+10);ctx.lineTo(o.x+o.w+8,o.y+10);ctx.closePath();ctx.fill();ctx.strokeStyle="#64748b";ctx.strokeRect(o.x,o.y,o.w,o.h)}
 for(const u of game.powerups||[]){if(u.x<leftX||u.x>rightX||u.y<topY||u.y>bottomY)continue;ctx.save();ctx.translate(u.x,u.y);ctx.rotate(now/500);ctx.fillStyle="#a78bfa";ctx.shadowColor="#c084fc";ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(12,0);ctx.lineTo(0,14);ctx.lineTo(-12,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("10",0,3);ctx.restore()}
 for(const b of game.bullets){if(b.x<leftX||b.x>rightX||b.y<topY||b.y>bottomY)continue;ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(b.x+3,b.y+5,b.bounce>0?6:5,3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.bounce>0?"#c084fc":(b.color||"#facc15");ctx.beginPath();ctx.arc(b.x,b.y-2,b.bounce>0?5:4,0,Math.PI*2);ctx.fill()}
 const me=renderPlayers.get(meId);
 if(me&&localPos){let nearest=null,best=Infinity;for(const q of renderPlayers.values()){if(q.id===meId||q.hp<=0||q.invisible)continue;const dx=q.rx-localPos.x,dy=q.ry-localPos.y,d2=dx*dx+dy*dy;if(d2<best){best=d2;nearest=q}}if(nearest){const targetAngle=Math.atan2(nearest.ry-localPos.y,nearest.rx-localPos.x);let delta=targetAngle-arrowAngle;while(delta>Math.PI)delta-=Math.PI*2;while(delta<-Math.PI)delta+=Math.PI*2;arrowAngle+=delta*(1-Math.exp(-12*dt));const edge=Math.min(w,h)*.34;ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.translate(w/2,h/2);ctx.rotate(arrowAngle);ctx.translate(edge,0);ctx.fillStyle="rgba(248,113,113,.95)";ctx.shadowColor="rgba(248,113,113,.45)";ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-9,-10);ctx.lineTo(-3,0);ctx.lineTo(-9,10);ctx.closePath();ctx.fill();ctx.restore()}}
 for(const p of renderPlayers.values()){const isMe=p.id===meId;if(isMe&&localPos){p.rx=localPos.x;p.ry=localPos.y}else{const smooth=1-Math.exp(-12*dt);p.rx+=(p.tx-p.rx)*smooth;p.ry+=(p.ty-p.ry)*smooth}if(p.invisible&&!isMe)continue;if(p.rx<leftX-40||p.rx>rightX+40||p.ry<topY-40||p.ry>bottomY+40)continue;ctx.save();ctx.translate(p.rx,p.ry);ctx.globalAlpha=p.hp>0?1:.45;ctx.fillStyle="rgba(0,0,0,.38)";ctx.beginPath();ctx.ellipse(0,13,19,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=isMe?(p.kit==="tank"?"#0ea5e9":p.kit==="scout"?"#22c55e":"#2563eb"):"#9333ea";ctx.beginPath();ctx.ellipse(0,5,16,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=isMe?(p.kit==="tank"?"#38bdf8":p.kit==="scout"?"#4ade80":"#60a5fa"):"#c084fc";ctx.beginPath();ctx.arc(0,-3,15,0,Math.PI*2);ctx.fill();ctx.rotate(p.angle);ctx.fillStyle="#f8fafc";ctx.fillRect(8,-4,20,8);ctx.restore();ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.rx,p.ry-24);ctx.fillStyle="#22c55e";ctx.fillRect(p.rx-20,p.ry+20,40*Math.max(0,p.hp/(p.maxHp||100)))}
 ctx.restore();requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
</script></body></html>
