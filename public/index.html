<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Muti Arena</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;color:#eef6ff;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
#lobby{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#18365b,#07101b 62%)}.card{width:min(92vw,420px);padding:28px;border:1px solid #36506b;border-radius:22px;background:#081421ee;box-shadow:0 20px 70px #0009}.card h1{margin:0 0 6px;font-size:38px}.card p{color:#91a6bc}.kits{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.kit{padding:12px 6px;border:1px solid #304b65;border-radius:12px;background:#0e1d2e;color:#cfe0f2;cursor:pointer}.kit.active{border-color:#7480ff;background:#17234a}.kit b{display:block;color:#fff;font-size:13px}.kit small{font-size:10px;color:#8da3ba}.card input,.card button{width:100%;height:50px;border-radius:12px;border:0;margin-top:10px;font:inherit}.card input{padding:0 14px;background:#132337;color:#fff}.card button{background:#6476ff;color:#fff;font-weight:800}
#game{display:none;position:fixed;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{padding:8px 12px;border:1px solid #304b65;border-radius:12px;background:#071321dd;font-size:13px}
.stick{display:none;position:absolute;bottom:max(24px,env(safe-area-inset-bottom));width:142px;height:142px;border-radius:50%;background:#0c1b2dcc;border:1px solid #52708eaa;box-shadow:0 10px 35px #0008;touch-action:none}.stick:after{content:"";position:absolute;inset:14px;border:1px dashed #49647e;border-radius:50%}.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:linear-gradient(145deg,#69a8ff,#716cff);box-shadow:0 7px 20px #0008;z-index:2}.left{left:24px}.right{right:24px}
@media(pointer:coarse),(max-width:900px){.stick{display:block}}@media(pointer:fine) and (min-width:901px){.stick{display:none}}
</style></head><body>
<section id="lobby"><div class="card"><h1>Muti Arena</h1><p>Organized multiplayer arena</p><input id="room" value="main" maxlength="18"><div class="kits"><div class="kit active" data-kit="sprinter"><b>SPRINTER</b><small>Fast movement</small></div><div class="kit" data-kit="guardian"><b>GUARDIAN</b><small>Balanced</small></div><div class="kit" data-kit="scout"><b>SCOUT</b><small>Quick control</small></div></div><button id="join">Enter Arena</button><p id="status">Connecting…</p></div></section>
<section id="game"><canvas id="cv"></canvas><div class="hud"><div class="pill" id="roomName">ROOM</div><div class="pill" id="score">Score 0</div><div class="pill" id="count">Players 0</div></div><div id="left" class="stick left"><div class="knob"></div></div><div id="right" class="stick right"><div class="knob"></div></div></section>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),lobby=document.getElementById("lobby"),game=document.getElementById("game"),join=document.getElementById("join"),roomInput=document.getElementById("room"),status=document.getElementById("status"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d"),roomName=document.getElementById("roomName"),scoreEl=document.getElementById("score"),countEl=document.getElementById("count"),left=document.getElementById("left"),right=document.getElementById("right");
let me="",players=new Map(),walls=[],world={w:2400,h:1600},target={x:0,y:0},local={x:0,y:0},camera={x:0,y:0},input={x:0,y:0},look={x:1,y:0},kit="sprinter";
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(d,0,0,d,0,0)}addEventListener("resize",resize);resize();
socket.on("connect",()=>status.textContent="Online");socket.on("disconnect",()=>status.textContent="Reconnecting…");socket.on("connect_error",()=>status.textContent="Connection unavailable");
document.querySelectorAll(".kit").forEach(el=>el.addEventListener("click",()=>{document.querySelectorAll(".kit").forEach(k=>k.classList.remove("active"));el.classList.add("active");kit=el.dataset.kit}));join.onclick=()=>socket.emit("join",{room:roomInput.value.trim()||"main",kit});
socket.on("joined",d=>{me=d.id;roomName.textContent="ROOM "+d.room;lobby.style.display="none";game.style.display="block";local.x=target.x=d.x;local.y=target.y=d.y;camera.x=d.x;camera.y=d.y});
socket.on("state",d=>{world=d.world;walls=d.walls||[];const seen=new Set;for(const p of d.players||[]){seen.add(p.id);let old=players.get(p.id)||{};players.set(p.id,{...old,...p});if(p.id===me){target.x=p.x;target.y=p.y;scoreEl.textContent="Score "+p.score}}for(const id of players.keys())if(!seen.has(id))players.delete(id);countEl.textContent="Players "+players.size});
function bindStick(el,type){let active=null;const knob=el.querySelector(".knob");function reset(){active=null;knob.style.transform="";input.x=input.y=0}function move(e){if(e.pointerId!==active)return;const r=el.getBoundingClientRect();let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),n=Math.hypot(x,y);if(n>50){x=x/n*50;y=y/n*50}knob.style.transform="translate("+x+"px,"+y+"px)";if(type==="move"){input.x=x/50;input.y=y/50}else{look.x=x/50;look.y=y/50}e.preventDefault()}el.addEventListener("pointerdown",e=>{if(active!==null)return;active=e.pointerId;el.setPointerCapture(e.pointerId);move(e)},{passive:false});el.addEventListener("pointermove",move,{passive:false});el.addEventListener("pointerup",reset);el.addEventListener("pointercancel",reset);el.addEventListener("lostpointercapture",reset)}bindStick(left,"move");bindStick(right,"look");
const keys=new Set;addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));addEventListener("blur",()=>keys.clear());
setInterval(()=>{if(!me||!socket.connected)return;let x=input.x,y=input.y;if(keys.has("a")||keys.has("arrowleft"))x--;if(keys.has("d")||keys.has("arrowright"))x++;if(keys.has("w")||keys.has("arrowup"))y--;if(keys.has("s")||keys.has("arrowdown"))y++;const n=Math.hypot(x,y);if(n>1){x/=n;y/=n}socket.emit("input",{x,y})},50);
function frame(now){const dt=Math.min((now-(frame.last||now))/1000,.05);frame.last=now;const smooth=1-Math.exp(-14*dt);local.x+=(target.x-local.x)*smooth;local.y+=(target.y-local.y)*smooth;camera.x+=(local.x-camera.x)*smooth;camera.y+=(local.y-camera.y)*smooth;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle="#06101a";ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(innerWidth/2-camera.x,innerHeight/2-camera.y);
ctx.fillStyle="#0a1725";ctx.fillRect(0,0,world.w,world.h);
ctx.strokeStyle="#18334a";ctx.lineWidth=2;for(let x=0;x<=world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<=world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
for(const w of walls){ctx.fillStyle="#26384a";ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle="#4a657d";ctx.strokeRect(w.x,w.y,w.w,w.h)}
for(const p of players.values()){ctx.beginPath();ctx.arc(p.x,p.y,p.id===me?20:18,0,Math.PI*2);ctx.fillStyle=p.id===me?"#7777ff":"#42cba2";ctx.fill();ctx.fillStyle="#fff";ctx.font="600 12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-28)}
if(me){ctx.strokeStyle="#9aa7ff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(local.x,local.y);ctx.lineTo(local.x+look.x*55,local.y+look.y*55);ctx.stroke()}ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
