<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mutiattack — Multiplayer 2D Shooter</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#080b14;color:#fff}body{display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;z-index:2}h1{font-size:18px;margin:0 12px 0 0}input,button{border:0;border-radius:8px;padding:9px 11px;background:#1f2937;color:#fff}button{background:#2563eb;font-weight:700}#status{font-size:13px;margin-left:auto}.wrap{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;background:#0d1420;touch-action:none}#leftStick,#rightStick{position:absolute;bottom:28px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);touch-action:none;display:none}#leftStick{left:28px}#rightStick{right:28px}.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(96,165,250,.65);border:2px solid rgba(255,255,255,.7)}#rightStick .knob{background:rgba(248,113,113,.7)}.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);font-size:12px;pointer-events:none}@media(pointer:coarse){#leftStick,#rightStick{display:block}.top{height:52px}.top input{width:90px}.top h1{display:none}.hint{top:auto;bottom:8px}}</style></head><body>
<div class="top"><h1>Mutiattack</h1><input id="name" placeholder="Name" value="Player"><input id="room" placeholder="Room" value="lobby"><button id="join">Join</button><span id="status">Connecting…</span></div>
<div class="wrap"><canvas id="game"></canvas><div class="hint">Left joystick: move • Right joystick: aim & shoot</div><div id="leftStick"><div class="knob"></div></div><div id="rightStick"><div class="knob"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),canvas=document.querySelector("#game"),ctx=canvas.getContext("2d"),statusEl=document.querySelector("#status"),left=document.querySelector("#leftStick"),right=document.querySelector("#rightStick");
let game={players:[],bullets:[]},meId=null,lastShot=0,keys=new Set(),moveStick={x:0,y:0},aimStick={x:0,y:0};
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=(innerHeight-58)*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener("resize",resize);resize();
socket.on("connect",()=>statusEl.textContent="Online");socket.on("joined",d=>{meId=d.id;statusEl.textContent="Room: "+d.roomId});socket.on("state",s=>{game=s;draw()});
document.querySelector("#join").onclick=()=>socket.emit("joinRoom",{roomId:document.querySelector("#room").value||"lobby",name:document.querySelector("#name").value||"Player"});
addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function stick(el,type){let activeId=null;function setPoint(p){const r=el.getBoundingClientRect();let x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2),d=Math.hypot(x,y);if(d>55){x=x/d*55;y=y/d*55}el.querySelector(".knob").style.transform=`translate(${x}px,${y}px)`;if(type==="move")moveStick={x:x/55,y:y/55};else aimStick={x:x/55,y:y/55}}el.addEventListener("pointerdown",e=>{if(activeId!==null)return;activeId=e.pointerId;el.setPointerCapture(e.pointerId);setPoint(e);e.preventDefault()},{passive:false});el.addEventListener("pointermove",e=>{if(e.pointerId===activeId){setPoint(e);e.preventDefault()}},{passive:false});function end(e){if(e.pointerId!==activeId)return;activeId=null;el.querySelector(".knob").style.transform="";if(type==="move")moveStick={x:0,y:0};else aimStick={x:0,y:0}}el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);el.addEventListener("lostpointercapture",()=>{activeId=null})}stick(left,"move");stick(right,"aim");
function loop(t){const p=game.players.find(p=>p.id===meId);if(p){let dx=moveStick.x,dy=moveStick.y;if(keys.has("a")||keys.has("arrowleft"))dx-=1;if(keys.has("d")||keys.has("arrowright"))dx+=1;if(keys.has("w")||keys.has("arrowup"))dy-=1;if(keys.has("s")||keys.has("arrowdown"))dy+=1;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}let angle=p.angle;if(Math.hypot(aimStick.x,aimStick.y)>.15){angle=Math.atan2(aimStick.y,aimStick.x);if(t-lastShot>120){socket.emit("shoot",{angle});lastShot=t}}if((keys.has(" ")||keys.has("enter"))&&t-lastShot>180){socket.emit("shoot",{angle});lastShot=t}if(dx||dy||angle!==p.angle)socket.emit("playerMove",{x:p.x+dx*6,y:p.y+dy*6,angle})}requestAnimationFrame(loop)}requestAnimationFrame(loop);
function draw(){const w=innerWidth,h=innerHeight-58;ctx.clearRect(0,0,w,h);ctx.strokeStyle="rgba(255,255,255,.06)";for(let x=0;x<w;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}for(const b of game.bullets){ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}for(const p of game.players){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.id===meId?"#60a5fa":"#c084fc";ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f8fafc";ctx.fillRect(8,-4,20,8);ctx.restore();ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-24);ctx.fillStyle="#22c55e";ctx.fillRect(p.x-20,p.y+20,40*(p.hp/100),4)}}draw();
</script></body></html>
