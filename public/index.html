<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Muti Arena</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#07101d;color:#fff;font-family:system-ui;touch-action:none}#lobby{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#17355a,#050a12)}.card{width:min(90%,420px);padding:28px;border:1px solid #385776;border-radius:22px;background:#07111de8;text-align:center}input,button{width:100%;height:50px;margin-top:10px;border:0;border-radius:12px;padding:0 14px;font:inherit}input{background:#122238;color:#fff}button{background:#6577ff;color:#fff;font-weight:800}#game{display:none;position:fixed;inset:0}canvas{width:100%;height:100%}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.pill{padding:8px 12px;border-radius:12px;background:#081526dd;border:1px solid #31506d}.stick{position:fixed;bottom:28px;width:140px;height:140px;border-radius:50%;background:#102038cc;border:1px solid #47627d;touch-action:none}.stick .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#6f78ff}.left{left:24px}.right{right:24px}@media(min-width:901px){.stick{display:none}}</style></head><body><section id="lobby"><div class="card"><h1>Muti Arena</h1><p>Multiplayer crystal arena</p><input id="room" value="main" maxlength="18"><button id="join">Enter Arena</button><p id="status">Connecting…</p></div></section><section id="game"><canvas id="cv"></canvas><div class="hud"><div class="pill" id="roomName">ROOM</div><div class="pill" id="score">Score 0</div><div class="pill" id="count">Players 0</div></div><div id="left" class="stick left"><div class="knob"></div></div><div id="right" class="stick right"><div class="knob"></div></div></section><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),lobby=document.getElementById("lobby"),game=document.getElementById("game"),join=document.getElementById("join"),room=document.getElementById("room"),status=document.getElementById("status"),canvas=document.getElementById("cv"),ctx=canvas.getContext("2d"),left=document.getElementById("left"),right=document.getElementById("right"),roomName=document.getElementById("roomName"),score=document.getElementById("score"),count=document.getElementById("count");
let me="",players=new Map(),orbs=[],world={w:2400,h:1600},pos={x:0,y:0},target={x:0,y:0},mv={x:0,y:0};function size(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener("resize",size);size();
socket.on("connect",()=>status.textContent="Online");socket.on("disconnect",()=>status.textContent="Reconnecting…");join.onclick=()=>socket.emit("join",room.value.trim()||"main");socket.on("joined",d=>{me=d.id;roomName.textContent="ROOM "+d.room;lobby.style.display="none";game.style.display="block";pos={x:d.x,y:d.y};target={...pos}});
socket.on("state",d=>{world=d.world;orbs=d.orbs;players.clear();for(const p of d.players){players.set(p.id,p);if(p.id===me){target.x=p.x;target.y=p.y;score.textContent="Score "+Math.floor(p.score)}}count.textContent="Players "+players.size});
function stick(el,type){let id=null;function set(e){let r=el.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),n=Math.hypot(x,y);if(n>50){x=x/n*50;y=y/n*50}el.querySelector(".knob").style.transform="translate("+x+"px,"+y+"px)";if(type==="move")mv={x:x/50,y:y/50}}function end(e){if(id!==e.pointerId)return;id=null;el.querySelector(".knob").style.transform="";if(type==="move")mv={x:0,y:0}}el.addEventListener("pointerdown",e=>{if(id!==null)return;id=e.pointerId;el.setPointerCapture(e.pointerId);set(e);e.preventDefault()},{passive:false});el.addEventListener("pointermove",e=>{if(e.pointerId===id){set(e);e.preventDefault()}},{passive:false});el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end)}stick(left,"move");stick(right,"aim");
const keys=new Set;addEventListener("keydown",e=>keys.add(e.key.toLowerCase()));addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
setInterval(()=>{if(!me||!socket.connected)return;let x=mv.x,y=mv.y;if(keys.has("a")||keys.has("arrowleft"))x--;if(keys.has("d")||keys.has("arrowright"))x++;if(keys.has("w")||keys.has("arrowup"))y--;if(keys.has("s")||keys.has("arrowdown"))y++;let n=Math.hypot(x,y);if(n>1){x/=n;y/=n}socket.emit("input",{x,y})},50);
function frame(){let f=.2;pos.x+=(target.x-pos.x)*f;pos.y+=(target.y-pos.y)*f;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle="#07101d";ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(innerWidth/2-pos.x,innerHeight/2-pos.y);ctx.fillStyle="#0c1827";ctx.fillRect(0,0,world.w,world.h);ctx.strokeStyle="#17324b";for(let x=0;x<world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}for(const o of orbs){ctx.fillStyle="#72e8ff";ctx.beginPath();ctx.arc(o.x,o.y,12,0,7);ctx.fill()}for(const p of players.values()){ctx.fillStyle=p.id===me?"#8179ff":"#4bd3a5";ctx.beginPath();ctx.arc(p.x,p.y,20,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-28)}ctx.restore();requestAnimationFrame(frame)}frame();
</script></body></html>
