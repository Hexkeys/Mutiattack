<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mutiattack — Multiplayer 2D Shooter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#080b14;color:#fff}body{display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#111827;z-index:2}h1{font-size:18px;margin:0 12px 0 0}input,button,select{border:0;border-radius:8px;padding:9px 11px;background:#1f2937;color:#fff}button{background:#2563eb;font-weight:700}#status{font-size:13px;margin-left:auto}.wrap{position:relative;flex:1;min-height:0;overflow:hidden}canvas{width:100%;height:100%;display:block;background:#0d1420;touch-action:none}#arena{position:absolute;inset:0}.hud{position:absolute;left:12px;top:12px;z-index:2;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.45);font-size:13px}.gunbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;z-index:4}.gun{padding:8px 10px;border:1px solid rgba(255,255,255,.18);background:rgba(15,23,42,.9)}.gun.active{outline:2px solid #60a5fa;background:#1e40af}.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.45);font-size:12px;pointer-events:none;z-index:2}#leftStick,#rightStick{position:absolute;bottom:28px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);touch-action:none;display:none;z-index:3}#leftStick{left:28px}#rightStick{right:28px}.knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(96,165,250,.65);border:2px solid rgba(255,255,255,.7)}#rightStick .knob{background:rgba(248,113,113,.7)}#lobby{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,7,18,.5);backdrop-filter:blur(12px);z-index:5}.card{width:min(390px,90vw);padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(15,23,42,.92);box-shadow:0 20px 70px rgba(0,0,0,.45);text-align:center}.card h2{margin:0 0 8px;font-size:30px}.card p{margin:0 0 18px;color:#94a3b8}.card input,.card select{width:100%;margin-bottom:10px}.play{width:100%;font-size:18px;padding:13px;border-radius:12px}@media(pointer:coarse){#leftStick,#rightStick{display:block}.top{height:52px}.top input{width:90px}.top h1{display:none}.hint{top:auto;bottom:8px}}
</style></head><body>
<div class="top"><h1>Mutiattack</h1><input id="name" placeholder="Name" value="Player"><input id="room" placeholder="Room" value="lobby"><button id="join">Join</button><span id="status">Connecting…</span></div>
<div class="wrap"><div id="arena"><canvas id="game"></canvas></div><div class="hud" id="hud">Gun: Pistol</div><div class="hint">Left: move • Right: aim & shoot</div><div class="gunbar"><button class="gun active" data-gun="pistol">Pistol</button><button class="gun" data-gun="smg">SMG</button><button class="gun" data-gun="shotgun">Shotgun</button><button class="gun" data-gun="rifle">Rifle</button></div><div id="leftStick"><div class="knob"></div></div><div id="rightStick"><div class="knob"></div></div>
<div id="lobby"><div class="card"><h2>MUTIATTACK</h2><p>Choose your weapon and jump in.</p><input id="lobbyName" placeholder="Your name" value="Player"><input id="lobbyRoom" placeholder="Room code" value="lobby"><select id="lobbyGun"><option value="pistol">Pistol — balanced</option><option value="smg">SMG — fast fire</option><option value="shotgun">Shotgun — spread</option><option value="rifle">Rifle — heavy hit</option></select><button class="play" id="play">PLAY</button></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io(),canvas=document.querySelector("#game"),ctx=canvas.getContext("2d",{alpha:false,desynchronized:true}),statusEl=document.querySelector("#status"),left=document.querySelector("#leftStick"),right=document.querySelector("#rightStick"),lobby=document.querySelector("#lobby"),hud=document.querySelector("#hud"),wrap=document.querySelector(".wrap");
let game={players:[],bullets:[],obstacles:[]},meId=null,lastShot=0,keys=new Set(),moveStick={x:0,y:0},aimStick={x:0,y:0},renderPlayers=new Map(),camera={x:600,y:350},dpr=1,viewW=innerWidth,viewH=wrap.clientHeight,lastFrame=performance.now();
function resize(){viewW=innerWidth;viewH=wrap.clientHeight;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.max(1,Math.floor(viewW*dpr));canvas.height=Math.max(1,Math.floor(viewH*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
socket.on("connect",()=>statusEl.textContent="Online");socket.on("joined",d=>{meId=d.id;statusEl.textContent="Room: "+d.roomId});
socket.on("state",s=>{game=s;const seen=new Set();for(const p of s.players){seen.add(p.id);const old=renderPlayers.get(p.id)||{rx:p.x,ry:p.y};renderPlayers.set(p.id,{...p,rx:old.rx,ry:old.ry,tx:p.x,ty:p.y})}for(const[id]of renderPlayers)if(!seen.has(id)&&id!==meId)renderPlayers.delete(id)});
function join(){const name=document.querySelector("#lobbyName").value||"Player",room=document.querySelector("#lobbyRoom").value||"lobby",gun=document.querySelector("#lobbyGun").value;document.querySelector("#name").value=name;document.querySelector("#room").value=room;socket.emit("joinRoom",{roomId:room,name,gun});lobby.style.display="none"}
document.querySelector("#play").onclick=join;document.querySelector("#join").onclick=()=>{socket.emit("joinRoom",{roomId:document.querySelector("#room").value||"lobby",name:document.querySelector("#name").value||"Player",gun:"pistol"});lobby.style.display="none"};
document.querySelectorAll(".gun").forEach(b=>b.onclick=()=>{socket.emit("selectGun",{gun:b.dataset.gun});document.querySelectorAll(".gun").forEach(x=>x.classList.remove("active"));b.classList.add("active");hud.textContent="Gun: "+b.textContent});
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(["1","2","3","4"].includes(e.key)){const guns=["pistol","smg","shotgun","rifle"],g=guns[Number(e.key)-1];socket.emit("selectGun",{gun:g});document.querySelectorAll(".gun").forEach((b,i)=>b.classList.toggle("active",i===Number(e.key)-1));hud.textContent="Gun: "+g[0].toUpperCase()+g.slice(1)}});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
function stick(el,type){let activeId=null;function setPoint(p){const r=el.getBoundingClientRect();let x=p.clientX-(r.left+r.width/2),y=p.clientY-(r.top+r.height/2),d=Math.hypot(x,y);if(d>55){x=x/d*55;y=y/d*55}el.querySelector(".knob").style.transform=`translate(${x}px,${y}px)`;if(type==="move")moveStick={x:x/55,y:y/55};else aimStick={x:x/55,y:y/55}}el.addEventListener("pointerdown",e=>{if(activeId!==null)return;activeId=e.pointerId;el.setPointerCapture(e.pointerId);setPoint(e);e.preventDefault()},{passive:false});el.addEventListener("pointermove",e=>{if(e.pointerId===activeId){setPoint(e);e.preventDefault()}},{passive:false});function end(e){if(e.pointerId!==activeId)return;activeId=null;el.querySelector(".knob").style.transform="";if(type==="move")moveStick={x:0,y:0};else aimStick={x:0,y:0}}el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end)}
stick(left,"move");stick(right,"aim");
setInterval(()=>{const p=game.players.find(p=>p.id===meId);if(!p)return;let dx=moveStick.x,dy=moveStick.y;if(keys.has("a")||keys.has("arrowleft"))dx-=1;if(keys.has("d")||keys.has("arrowright"))dx+=1;if(keys.has("w")||keys.has("arrowup"))dy-=1;if(keys.has("s")||keys.has("arrowdown"))dy+=1;const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}let angle=p.angle;if(Math.hypot(aimStick.x,aimStick.y)>.15)angle=Math.atan2(aimStick.y,aimStick.x);else if(keys.has(" ")||keys.has("enter"))angle=p.angle;socket.volatile.emit("playerInput",{x:dx,y:dy,angle});const now=performance.now();const gun=p.gun||"pistol";const rate=gun==="smg"?75:gun==="shotgun"?520:gun==="rifle"?360:220;if(Math.hypot(aimStick.x,aimStick.y)>.15&&now-lastShot>rate){socket.emit("shoot",{angle});lastShot=now}if((keys.has(" ")||keys.has("enter"))&&now-lastShot>rate){socket.emit("shoot",{angle});lastShot=now}},50);
function frame(now){const dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;const follow=1-Math.exp(-14*dt),w=viewW,h=viewH,p=renderPlayers.get(meId);if(p){camera.x+=(p.rx-camera.x)*follow;camera.y+=(p.ry-camera.y)*follow}ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2-camera.x,h/2-camera.y);const leftX=camera.x-w/2-60,rightX=camera.x+w/2+60,topY=camera.y-h/2-60,bottomY=camera.y+h/2+60;ctx.strokeStyle="rgba(255,255,255,.06)";ctx.beginPath();for(let x=Math.floor(leftX/48)*48;x<=rightX;x+=48){ctx.moveTo(x,topY);ctx.lineTo(x,bottomY)}for(let y=Math.floor(topY/48)*48;y<=bottomY;y+=48){ctx.moveTo(leftX,y);ctx.lineTo(rightX,y)}ctx.stroke();for(const o of game.obstacles){if(o.x+o.w<leftX||o.x>rightX||o.y+o.h<topY||o.y>bottomY)continue;ctx.fillStyle="#334155";ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle="#64748b";ctx.strokeRect(o.x,o.y,o.w,o.h)}for(const b of game.bullets){if(b.x<leftX||b.x>rightX||b.y<topY||b.y>bottomY)continue;ctx.fillStyle=b.color||"#facc15";ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}for(const p of renderPlayers.values()){const smooth=1-Math.exp(-(p.id===meId?22:12)*dt);p.rx+=(p.tx-p.rx)*smooth;p.ry+=(p.ty-p.ry)*smooth;if(p.rx<leftX-40||p.rx>rightX+40||p.ry<topY-40||p.ry>bottomY+40)continue;ctx.save();ctx.translate(p.rx,p.ry);ctx.rotate(p.angle);ctx.globalAlpha=p.hp>0?1:.45;ctx.fillStyle=p.id===meId?"#60a5fa":"#c084fc";ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f8fafc";ctx.fillRect(8,-4,20,8);ctx.restore();ctx.globalAlpha=1;ctx.fillStyle="#fff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.rx,p.ry-24);ctx.fillStyle="#22c55e";ctx.fillRect(p.rx-20,p.ry+20,40*Math.max(0,p.hp/100),4)}ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
